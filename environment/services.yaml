        verified: True
      - id: drv_pay_theory
        name: Pay theory exam fee
        agency: Rwanda National Police
        portal: Irembo / mobile money
        needs_docs: [phone_mobile_money]
        needs_steps: [drv_book_theory]
        produces_docs: [proof_of_payment]
        fee_rwf: 5000
        days: [0, 1]
        success_prob: 0.97
        on_fail: retry
        in_person: false
        source: https://irembo.gov.rw/home/citizen/all_services
        verified: True
      - id: drv_pass_theory
        name: Sit and pass theory exam
        agency: Rwanda National Police
        portal: Exam centre
        needs_docs: [national_id, proof_of_payment]
        needs_steps: [drv_pay_theory]
        produces_docs: []
        fee_rwf: 0
        days: [1, 3]
        success_prob: 0.60          # simulation parameter: stochastic exam outcome
        on_fail: goto:drv_book_theory
        in_person: true
        source: TODO (pass rate is a modelling choice, not an official statistic)
        verified: false
      - id: drv_book_practical
        name: Book practical exam
        agency: Rwanda National Police
        portal: Irembo
        needs_docs: [phone_mobile_money]
        needs_steps: [drv_pass_theory]
        produces_docs: []
        fee_rwf: 5000
        days: [3, 10]
        success_prob: 0.95
        on_fail: retry
        in_person: false
        source: https://irembo.gov.rw/home/citizen/all_services
        verified: True
      - id: drv_pass_practical
        name: Sit and pass practical exam
        agency: Rwanda National Police
        portal: Test ground
        needs_docs: [national_id]
        needs_steps: [drv_book_practical]
        produces_docs: []
        fee_rwf: 0
        days: [1, 3]
        success_prob: 0.55          # simulation parameter
        on_fail: goto:drv_book_practical
        in_person: true
        source: https://irembo.gov.rw/home/citizen/all_services
        verified: True
      - id: drv_issue_definitive
        name: Pay and receive definitive licence
        agency: Rwanda National Police
        portal: Irembo / mobile money
        needs_docs: [phone_mobile_money]
        needs_steps: [drv_pass_practical]
        produces_docs: []
        fee_rwf: 50000
        days: [3, 10]
        success_prob: 0.97
        on_fail: retry
        in_person: false
        source: https://irembo.gov.rw/home/citizen/all_services
        verified: True

