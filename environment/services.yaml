# GovMate service graph  (environment/services.yaml)
#
# IMPORTANT: every fee_rwf, days and success_prob value below is a PLACEHOLDER
# written from general knowledge. verified: false means it has NOT been checked
# against the live portal. Before submitting, check each value against its
# source (Irembo, RDB, RRA, BPMIS, Rwanda National Police, MINALOC, etc.), then
# fill `source` with the URL + date visited and set verified: true.
# Simulation rules (success_prob, delays, retries) are modelling choices, and
# should be described as such in the report.

meta:
  version: 1
  currency: RWF
  max_steps: 60            # episode cap (terminal condition)
  max_days: 120            # simulated days; also used to normalise `days_elapsed`
  max_fees_rwf: 300000     # used to normalise `fees_spent`

# Hidden inventory the citizen may already hold.
documents:
  - national_id
  - phone_mobile_money
  - passport_photo
  - tin
  - upi_land_title
  - proof_of_payment      # produced by payment steps, consumed by the next step
  - business_cert

# How a new citizen (episode start state) is sampled.
citizen:
  goal_probs:             # uniform over the five goals
    business_registration: 0.2
    driving_licence: 0.2
    land_tax: 0.2
    passport: 0.2
    building_permit: 0.2
  doc_hold_probs:         # chance the citizen starts out holding each document
    national_id: 0.90
    phone_mobile_money: 0.85
    passport_photo: 0.50
    tin: 0.25
    upi_land_title: 0.40
    proof_of_payment: 0.0
    business_cert: 0.10
  patience: {low: 8, high: 14}      # integer; each wasted/annoying action costs patience
  digital_access_prob: 0.70         # without it, online steps need an in-person alternative
  # provenance note for report: all citizen attributes are simulated samples
  # (no real personal data is used).


rewards:
  step_cost: -0.05
  prerequisite_done: 1.5
  goal_complete: 20.0
  redundant_action: -0.5      # repeated question / repeated step
  invalid_action: -1.0        # premature or impossible step
  abandon: -10.0
  per_day_cost: -0.01
  per_1000_rwf_cost: -0.02


observation_provenance:
  goal_estimate: agent belief, updated by clarify_goal; true goal is hidden
  document_flags: 0.5 unknown; becomes 0/1 after ask_documents (citizen answer)
  stage_progress: simulation rule (completed steps / total steps of active goal)
  last_outcome: simulation rule (success / rejected / delayed / not_applicable)
  days_elapsed: simulation clock, advanced by each step's processing time
  fees_spent: accumulated step fees from this file
  patience: simulated citizen state, decremented by redundant/invalid actions
  digital_access: simulated citizen attribute, revealed by ask_eligibility

# Goals and their service steps.
# Fields per step:
#   needs_docs     documents the citizen must hold before this step can run
#   needs_steps    steps that must be completed first
#   produces_docs  documents the citizen holds after success
#   fee_rwf        cost charged when the step is executed
#   days           [min, max] simulated processing days (sampled uniformly)
#   success_prob   probability the step succeeds (1.0 = always)
#   on_fail        retry | goto:<step_id> (rejection sends the citizen back)
#   in_person      true if it requires a physical visit (needs no digital access)
#   agency, portal where the step happens
#   source, verified   provenance of fee/time values

goals:

  business_registration:
    description: Register a company and obtain tax registration
    steps:
      - id: biz_name_reservation
        name: Reserve business name
        agency: RDB
        portal: Irembo / RDB online registration
        needs_docs: [national_id, phone_mobile_money]
        needs_steps: []
        produces_docs: []
        fee_rwf: 0
        days: [1, 2]
        success_prob: 0.90
        on_fail: retry
        in_person: false
        source: https://urs.rdb.rw/auth/login
        verified: True
      - id: biz_submit_registration
        name: Submit company registration
        agency: RDB
        portal: RDB online registration
        needs_docs: [national_id]
        needs_steps: [biz_name_reservation]
        produces_docs: []
        fee_rwf: 0
        days: [1, 3]
        success_prob: 0.92
        on_fail: retry
        in_person: false
        source: https://urs.rdb.rw/auth/login
        verified: True
      - id: biz_pay_fee
        name: Pay registration fee
        agency: RDB
        portal: Irembo / mobile money
        needs_docs: [phone_mobile_money]
        needs_steps: [biz_submit_registration]
        produces_docs: [proof_of_payment]
        fee_rwf: 25000
        days: [0, 1]
        success_prob: 0.97
        on_fail: retry
        in_person: false
        source: https://urs.rdb.rw/auth/loginTODO
        verified: True
      - id: biz_certificate_issued
        name: Registration certificate issued
        agency: RDB
        portal: RDB
        needs_docs: [proof_of_payment]
        needs_steps: [biz_pay_fee]
        produces_docs: [business_cert]
        fee_rwf: 0
        days: [1, 3]
        success_prob: 0.95
        on_fail: retry
        in_person: false
        source: https://urs.rdb.rw/auth/login
        verified: True
      - id: biz_tax_registration
        name: Tax registration (TIN)
        agency: RRA
        portal: RRA e-tax
        needs_docs: [national_id, business_cert]
        needs_steps: [biz_certificate_issued]
        produces_docs: [tin]
        fee_rwf: 0
        days: [1, 2]
        success_prob: 0.93
        on_fail: retry
        in_person: false
        source: https://onestopcentre.rdb.rw/
        verified: True

  driving_licence:
