      - id: drv_book_theory
        name: Book PDL theory exam
        agency: Rwanda National Police
        portal: Irembo
        needs_docs: [phone_mobile_money]
        needs_steps: [drv_provisional_application]
        produces_docs: []
        fee_rwf: 0
        days: [2, 7]
        success_prob: 0.95
        on_fail: retry
        in_person: false
