[project]
name = "Celine_Shoga_rl_summative"
version = "0.1.0"
description = "GovMate: RL agent guiding citizens through multi-agency government services"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.9",
    "torchrl>=0.10",
    "tensordict>=0.10",
    "gymnasium>=1.0",
    "pygame-ce>=2.5",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "tqdm",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
